[package]
name = "harbor-registry"
version = "0.1.0"
edition = "2024"
description = "Pulls container images from public registries into a local content-addressed store, unpacks their layers for overlayfs, and serves them as a small Docker Registry HTTP API v2"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
